name: Unity tests

# Manual only: account authentication needs explicit owner authorization.
# 仅手动触发；填写密码不自动授权登录或测试。
on:
  workflow_dispatch:
    inputs:
      allow_unity_login:
        description: 'I authorize Unity login and both test suites for this run / 本次允许 Unity 登录和测试'
        required: true
        type: boolean
        default: false
      test_scope:
        description: 'compact = same local regression; full = complete suite; other scopes = diagnosis only'
        required: true
        type: choice
        default: compact
        options:
          - compact
          - full
          - remaining-ci-failures
          - p15-ci-repairs
          - p15-ci-five-failures
          - p15-ci-four-failures

permissions:
  contents: read

# One account-authenticating workflow at a time, across all branches.
# 所有分支共用同一组，避免多个运行同时登录。
concurrency:
  group: unity-account-authentication
  cancel-in-progress: false

jobs:
  tests:
    name: Unity EditMode and PlayMode
    if: ${{ inputs.allow_unity_login }}
    runs-on: ubuntu-22.04
    # Allow cold Library imports; compact changes selection, not assertion/time budgets.
    # 精简范围与本地共用；保留冷导入上限，不延长游戏测试自身的等待。
    timeout-minutes: 150
    steps:
      - name: Check out project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Validate shared regression scope without Unity login
        run: python3 -B -m unittest discover -s Tools/Testing -p test_unity_regression.py

      - name: Read shared compact selectors
        id: scope
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        shell: bash
        run: |
          if [[ "$TEST_SCOPE" == 'compact' ]]; then
            FILTER="$(python3 Tools/Testing/unity_regression.py filter --mode all)"
            echo "parameters=-testFilter $FILTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Unity version and CI license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          grep -Fxq 'm_EditorVersion: 6000.5.5f1' ProjectSettings/ProjectVersion.txt || {
            echo '::error::Update the workflow Unity version when changing ProjectVersion.txt.'
            exit 1
          }
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Configure UNITY_EMAIL, UNITY_PASSWORD, and UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in repository Actions secrets.'
            exit 1
          fi

      - name: Cache imported assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          key: Unity-Linux-6000.5.5f1-all-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Linux-6000.5.5f1-all-

      - name: Check out pinned GameCI runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: game-ci/unity-test-runner
          ref: fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
          path: .ci/gameci-test-runner
          persist-credentials: false

      - name: Remove automatic activation retries before credentials are used
        run: python3 .github/scripts/disable-gameci-activation-retries.py .ci/gameci-test-runner

      - name: Run selected EditMode and PlayMode after one activation
        id: tests
        # Same pinned runner, with its activation loop removed before invocation.
        # 同一固定版本；all 模式只激活一次，再顺序执行 EditMode / PlayMode。
        uses: ./.ci/gameci-test-runner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 6000.5.5f1
          testMode: all
          customParameters: ${{ inputs.test_scope == 'compact' && steps.scope.outputs.parameters || inputs.test_scope == 'p15-ci-four-failures' && '-testFilter AnimalCafe.Tests.EditMode.Phase14.ServiceTrafficCoordinatorTests;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserLongCounterSevenNormal;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserLongCounterSixNormal;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserPhotoCounterSevenFast;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserPhotoCounterSevenNormal' || inputs.test_scope == 'p15-ci-five-failures' && '-testFilter AnimalCafe.Tests.EditMode.Phase14.ServiceTrafficCoordinatorTests;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.MainDefaultCounterPlacementCompletesServiceWithoutTrafficDeadlock;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserLongCounterSevenNormal;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserLongCounterSixFast;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserLongCounterSixNormal;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.UserPhotoCounterSevenNormal -waitFailureIntent=* -p15CiFailureWitness' || inputs.test_scope == 'remaining-ci-failures' && '-testFilter P8RGlyphMinificationTests;GeneratedProductionViews_ReducedMotionPauseAndRapidReverseFinishOneStableRaycastOwner' || inputs.test_scope == 'p15-ci-repairs' && '-testFilter UiPublishBackup_RestoreWithRestrictiveReaderRespectsPlatformSharingWithoutTempLeak;UiPublishBackup_RestoreDirectoryConflictPropagatesWithoutTempLeak;AnimalCafe.Tests.EditMode.Phase7.Phase7PublicationIoTests;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.ThreeNaturalCustomersReleasePickupDependenciesAndActuallyExit;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.CenterCounterContinuousBusinessNormal;AnimalCafe.Tests.EditMode.Phase14.ServiceTrafficCoordinatorTests;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.PhotoParallelBenchesExposeActualPickupWaitReason;AnimalCafe.Tests.PlayMode.Phase14.CafePickupSideTests.PhotoParallelBenchesConfiguredConflictHoldsAndResumesOriginalAdmission -serviceTrafficWaitTrace -waitFailureIntent=*' || '' }}
          artifactsPath: artifacts/unity
          githubToken: ''

      - name: Verify and summarize NUnit results
        if: always() && steps.tests.outcome == 'success'
        env:
          RESULTS_PATH: artifacts/unity
          TESTED_COMMIT: ${{ github.sha }}
          TEST_SCOPE: ${{ inputs.test_scope }}
        shell: bash
        run: python3 Tools/Testing/unity_regression.py verify --scope "$TEST_SCOPE" --results "$RESULTS_PATH"

      - name: Preserve test results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-${{ inputs.test_scope }}-${{ github.run_attempt }}
          path: |
            artifacts/unity
            outputs/phase15/long-counter-stall/live-*
            outputs/phase15/service-traffic-coordination-20261030/task-1
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Unity CI
    if: always()
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Require both suites to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          if [[ "$TEST_SCOPE" != 'compact' && "$TEST_SCOPE" != 'full' ]]; then
            echo '::error::Focused diagnosis does not satisfy Unity CI; select compact or full.'
            exit 1
          fi
          if [[ "$TEST_RESULT" != 'success' ]]; then
            echo '::error::Both EditMode and PlayMode must pass; failed, skipped, or cancelled runs do not pass this check.'
            exit 1
          fi
